services:
  db-kafka:
    image: lensesio/fast-data-dev:3.9.0
    hostname: kafka
    environment:
      ADV_HOST: kafka
      RUNNING_SAMPLEDATA: 1
      RUNTESTS: 0
      # The next three variables are required if you want to have Kafka
      # available at the host for local development. They are tailored to KRaft
      # fast-data-dev (3.9.x or later). The broker will be available at localhost:9092.
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKERCOMPOSE://:19092,CONTROLLER://:16062
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKERCOMPOSE://demo-kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        DOCKERCOMPOSE:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,
        SSL:SSL,SASL_PLAINTEXT:SASL_PLAINTEXT,SASL_SSL:SASL_SSL
      # Makes things a little lighter
      DISABLE: debezium-mongodb,debezium-mysql,debezium-postgres,debezium-sqlserver,debezium-jdbc
    # These are the ports for Kafka and Schema Registry. You can disable them if
    # you don't need to access Kafka from your host.
    ports:
      - 9092:9092
      - 8081:8081
      - 8083:8083
      - 3030:3030
    networks:
      datapipe:
    volumes:
      - data-kafka:/data
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:v0.6.0
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=db-kafka:9092
      - LOGGING_LEVEL_ROOT=error
      - LOGGING_LEVEL_COM_PROVECTUS=error
      - KAFKA_CLUSTERS_0_JMXPORT=9997
      - DYNAMIC_CONFIG_ENABLED=true
    networks:
      datapipe:
    ports:
      - '9019:8080'
  graphql-service:
    container_name: graphql-service
    build:
      context: ../graphql-service
      dockerfile: ../graphql-service/Dockerfile
    depends_on:
      - db-kafka
    ports:
        - '4000:4000'
    environment:
      - LOG_LEVEL=debug
      - PORT=:4000
      - ENVIRONMENT=dev
      - KAFKA_BROKER=db-kafka:9092
      - KAFKA_TOPIC=data-pipe
      - DB_FILE=user-feedback.sqlite
    networks:
      datapipe:
    volumes:
      - "./db/feedback.sqlite:/feedback.sqlite"
  rest-service:
    container_name: rest-service
    build:
      context: ../rest-service
      dockerfile: ../rest-service/Dockerfile
    ports:
      - '8080:8080'
    environment:
      - LOG_LEVEL=debug
      - PORT=:8080
      - ENVIRONMENT=dev
      - DB_FILE=email.sqlite
    networks:
      datapipe:
    volumes:
      - "./db/email.sqlite:/email.sqlite"
  benthos:
    container_name: benthos
    image: jeffail/benthos:4.7.0
    command:
       - -c
       - config.yaml
    depends_on:
      - rest-service
    volumes:
      - "./benthos/kafka-consumer.yaml:/config.yaml"
    networks:
      datapipe:
volumes:
  data-kafka:
    driver: local
networks:
  datapipe:
    driver: bridge
